name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build pkg-config libssl-dev python3 openssl procps
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja pkg-config openssl@3
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "SLUICE_OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
      - name: Build
        run: |
          meson setup build
          meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs

  sanitizers:
    name: address and undefined-behaviour sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build pkg-config libssl-dev python3 openssl procps
      - run: |
          meson setup build-asan -Db_sanitize=address,undefined -Db_lundef=false
          meson compile -C build-asan
          meson test -C build-asan --print-errorlogs

  real-postgres:
    name: real PostgreSQL and client libraries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build pkg-config libssl-dev python3 openssl procps
          pip install uv
      - run: |
          meson setup build
          meson compile -C build
      - name: psql, pgbench, TLS
        run: SLUICE_REAL_PG=1 python3 tests/realpg.py build/sluice
      - name: psycopg, asyncpg, SQLAlchemy
        run: |
          SLUICE_REAL_PG=1 uvx --with "psycopg[binary]" --with asyncpg --with sqlalchemy \
            python3 tests/drivers.py build/sluice

  static:
    name: static release binary (Alpine, optimized build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # the optimized build has warnings that the debug build does not: this is the one that gets released
      - run: docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh tools/build-static.sh "$(git rev-parse --short=9 HEAD)"
      - run: ./dist/sluice --version

  container:
    name: the images build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sluice . && docker run --rm sluice --version
      - run: docker build --target tools -t sluice:tools . && docker run --rm sluice:tools --version
